# FINGU-GRINDA/rinda-plugin 쪽에서 도는 워크플로. publish-rinda-plugin.yml 이 sync 태그 커밋에 넣어 보낸다.
# 조직 룰셋이 모든 브랜치에 검증된 서명을, main 에는 Security Gate(public-gate) 통과 PR 을 요구한다.
# deploy key 는 서명도 PR 도 못 하므로 태그(룰셋 대상 아님)로 트리를 받고, 여기서 GITHUB_TOKEN 으로
# GitHub 서명 커밋 → sync-* 브랜치 → PR → public-gate 통과 대기 → 스쿼시 머지까지 한다.
name: Promote sync tag
on:
  push:
    tags: ['sync/*']
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Signed PR to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null || true' EXIT
          msg=$(gh api "repos/$REPO/git/commits/$SHA" -q .message)
          tree=$(gh api "repos/$REPO/git/commits/$SHA" -q .tree.sha)
          parent=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          parent_tree=$(gh api "repos/$REPO/git/commits/$parent" -q .tree.sha)
          # .github 는 main 것을 그대로 둔다 — GITHUB_TOKEN 은 워크플로 파일을 만들거나 고치거나 지울 수 없다
          gh api "repos/$REPO/git/trees/$tree" -q '[.tree[] | select(.path != ".github") | {path, mode, type, sha}]' > src.json
          gh api "repos/$REPO/git/trees/$parent_tree" -q '[.tree[] | select(.path == ".github") | {path, mode, type, sha}]' > keep.json
          jq -s '{tree: (.[0] + .[1])}' src.json keep.json > tree.json
          newtree=$(gh api "repos/$REPO/git/trees" --input tree.json -q .sha)
          if [ "$parent_tree" = "$newtree" ]; then
            echo "변경 없음"
            exit 0
          fi
          jq -n --arg m "$msg" --arg t "$newtree" --arg p "$parent" '{message: $m, tree: $t, parents: [$p]}' > commit.json
          commit=$(gh api "repos/$REPO/git/commits" --input commit.json -q .sha)
          echo "commit=$commit verified=$(gh api "repos/$REPO/git/commits/$commit" -q .verification.verified)"

          # 룰셋이 force-push 를 막으므로 sync 마다 새 브랜치. 앞선 sync PR 은 이 PR 이 대체한다.
          branch="sync-${TAG#sync/}"
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" > /dev/null
          for n in $(gh pr list -R "$REPO" --state open --base main --json number,headRefName -q '.[] | select(.headRefName | startswith("sync-")) | .number'); do
            gh pr close -R "$REPO" "$n" --delete-branch --comment "superseded by $branch" || true
          done
          url=$(gh pr create -R "$REPO" --base main --head "$branch" --title "$msg" --body "Automated sync from send-grid-test (tag $TAG).")
          echo "pr=$url"

          # Security Gate(public-gate) 가 이 커밋에서 통과해야 머지된다. 봇이 연 PR 의 gate 실행은
          # 저장소 승인 정책(all_external_contributors)에 걸려 action_required 로 멈추므로 승인해 준다.
          for _ in $(seq 1 60); do
            for run in $(gh api "repos/$REPO/actions/runs?head_sha=$commit&event=pull_request" -q '.workflow_runs[] | select(.conclusion == "action_required") | .id'); do
              gh api -X POST "repos/$REPO/actions/runs/$run/approve" > /dev/null
            done
            st=$(gh api "repos/$REPO/commits/$commit/check-runs" -q '[.check_runs[] | select(.name == "public-gate")] | if length == 0 then "none" else (.[0].status + ":" + (.[0].conclusion // "")) end')
            case "$st" in
              completed:success) break ;;
              completed:action_required) ;; # 방금 승인 — 다음 바퀴에 다시 돈다
              completed:*) echo "::error::public-gate $st — $url"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$st" = "completed:success" ] || { echo "::error::public-gate 미완료($st) — $url"; exit 1; }
          gh pr merge -R "$REPO" "$url" --squash --delete-branch
          echo "merged main=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)"
